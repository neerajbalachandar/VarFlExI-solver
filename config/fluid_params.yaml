run_name: rect_nonlinear_regime
particles_per_step: 4
save_every: 2

aoa_deg: 3.0
vinf: 250.0
rho: 0.38
nu: 3.76e-05

# V(x,t) = V0 + G*(x-x_ref) + cyclic transverse sinusoidal gust.
# Gust amplitudes are m/s, wavenumbers are rad/m; this deterministic gust is
# not a substitute for resolved turbulence or an LES inflow.
freestream_gradient: [0, 0, 0, 0, 0, 0, 0, 0, 0]
freestream_oscillation: [0.0, 0.0, 2.5]
freestream_wavenumber: [0.7, 0.0, 0.0]
freestream_frequency_hz: 1.2
freestream_phase_deg: 0.0
freestream_reference: [0, 0, 0]

# Empty polar disables parasitic drag; provide a validated sectional polar to enable it.
section_polar: ""
section_polar_path: ""

# FLOWUnsteady's boundary-layer wake shedding is experimental and distinct from polar drag.
shed_boundarylayer: false
boundarylayer_prescribed_cd: 0.1
boundarylayer_dipole_width: 0.0

twist_root: 0.0
twist_tip: 0.0
dihedral: 0.0

n_span: 80
n_chord: 1
eta_cp: 0.75
eta_bv: 0.25

x: 1.0
y: 1.0
z: 1.0

lambda_vpm: 2.0
remove_every: 100
sphere_factor: 200.0
# Disable strength and core-size pruning while diagnosing wake truncation.
# The solver's distant spherical cleanup remains enabled (at sphere_factor).
min_factor: 0.0
max_factor: 1.0e12

wake_coupled: true
start_with_wake: true
unsteady: true
unsteady_criterion: 0.0
omit_rows: []

relaxation: 0.35
sigma_solver: -1
sigma_surface: 0.025

p: 4
ncrit: 50
theta: 0.4

shrink_recenter: true
relative_tolerance: 1.0e-3
absolute_tolerance: 1.0e-3
autotune_p: true
autotune_ncrit: true
autotune_regularization: false
default_rho_over_sigma: 1.0
minimum_ncrit: 3

viscous_scheme: none
vpm_sfs: none

save_directory: results/rect_nonlinear_regime/fluid/
create_directory: true
create_savepath: true
prompt: false
io: false

print_solver_info: true
save_geometry_csv: true
save_force_history: true
save_diagnostics: true
save_horseshoes: true
regularize_vlm: true
nsteps_save: 2