total_time: 1.5
# Faster exploratory run: dt = 1.5 / 600 = 0.0025 s.
# This is a coarser temporal discretization than the 6000-step run.
n_steps: 600

host: 127.0.0.1
port: 9000

comm_nspan: 80
comm_nchord: 1

work_conservative_mode: true
work_conservation_mode: true

span_sampling_mode: midpoint
custom_span_stride: null

force_transfer_mode: crm
# Geometry/displacement transfer to aerodynamic LE/TE stations.
displacement_transfer_mode: crm
rbf_radius: 0.03
rbf_neighbors: 24
# null disables component-wise force clipping; non-finite forces still error.
max_abs_force_component: null

enforce_chord_projection: false
enforce_span_projection: false

force_relax: 1.0
geom_relax: 1.0
force_change_warning_relative: 0.5
force_change_warning_interval: 20
epsilon_reg: 1.0e-16

debug_io: null
payload_indexing: null

send_cp: true
send_le: true
send_te: true

results_root: results/06-11-crm/
