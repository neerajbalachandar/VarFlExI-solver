
span: 0.96
root_chord: 0.24
tip_chord: 0.24
thickness_ratio: 0.08
leading_edge_sweep: 0.0

nx: 30
ny: 160

results_root: results/rect_linear_regime/
output_dir: solid/
output_run_name: rect_linear_regime

xdmf_filename: elastodynamics-results.xdmf
mesh_pvd_filename: solid_mesh.pvd
q_pvd_filename: plate_state.pvd
sig_pvd_filename: membrane_stress.pvd
diag_csv_filename: solid_v18_diagnostics.csv

E: 3.0e9
nu: 0.30
rho_s: 1200.0

eta_m: 1.2
eta_k: 5.0e-5
