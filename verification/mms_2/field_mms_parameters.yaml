# Configuration for the continuum velocity-vorticity field MMS.
# Geometry fields are read from the production config files at run time.
config_dir: config
output_dir: verification/mms_2/results
analytical_reference_time_s: 0.05

target:
  amplitude: 0.02        # m^2/s for vector-potential scale
  frequency: 12.0       # rad/s; appreciable evolution over 0.05 s
  phase: 0.37           # rad; avoids component degeneracy
  center: [0.12, 0.48, 0.0]
  support_radii: [0.38, 0.42, 0.32]  # compact ellipsoidal support, metres
  smallest_target_length_scale: 0.32  # m; smallest prescribed support radius

physics:
  viscous_scheme: none
  vpm_sfs: none
  viscosity_m2_s: 0.0

field_spatial_study:
  dt_s: 0.00025
  final_time_s: 0.05
  cases:
    - {level: 1, fluid_spanwise_stations: 96, particle_refinement: 1}
    - {level: 2, fluid_spanwise_stations: 192, particle_refinement: 2}
    - {level: 3, fluid_spanwise_stations: 384, particle_refinement: 4}

temporal_study:
  fluid_spanwise_stations: 384
  dt_s: [0.001, 0.0005, 0.00025]
  final_time: 0.05

particles:
  # Population and core-size are sourced from the case's actual production
  # ParticleField; these are planning values, not inferred from VLM resolution.
  lambda_sigma: 2.0
  core_grid_intervals_minimum: 8
  fixed_population_controls:
    # Mirrored in fluid_mms_config.yaml; fluid/src/FluidConfig.jl and
    # fluid/src/setup.jl map these settings into the production runtime.
    particles_per_step: 0
    start_with_wake: false
    unsteady: false
    wake_coupled: false
    shed_boundarylayer: false
    pruning_thresholds_configured_as_noop: true
  record_count_at_every_step: true
  fail_if_count_changes: true
  identity_audit_required: true

reconstruction:
  # One fixed box for all levels. Domain extent includes the wing and a broad
  # wake region; runtime checks additionally require the actual particle/core
  # envelope to remain inside it.
  bounds:
    - [-0.48, 0.72]
    - [-0.24, 1.20]
    - [-0.48, 0.48]
  grid_resolution: derive_from_actual_particle_cores_and_target_scale
  preflight_cells: [8, 8, 8]  # lightweight target-norm sampling; not a run grid
  # Compare the representative spatial-level-1 case against doubled cells.
  sensitivity_level: 1
  sensitivity_factor: 2
  sensitivity_relative_tolerance: 0.01
  sensitivity_norm_floor: 1.0e-14
  # A hard safety cap prevents accidental OOM; the entry point fails without
  # silently reducing the spacing derived from sigma and target scale.
  maximum_grid_points: 2000000
  core_support_radii: 4.0
  minimum_boundary_clearance_core_radii: 2.0
  # Smallest localized target scale imposes another spacing limit.
  target_intervals_per_length_scale: 20

mode_support:
  structural_config: mms_parameters.yaml
  field_config: field_mms_parameters.yaml
  coupled_status: unsupported_until_particle_source_projection_is_implemented
